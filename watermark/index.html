<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    {
      let theme;
      try { theme = localStorage.getItem("soop-recap-watermark-theme"); } catch {}
      document.documentElement.dataset.recapTheme = theme === "dark" || theme === "light" ? theme :
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      --page: #1f1f23;
      --header: #1f1f23;
      --panel: #121215;
      --inset: #1c1c21;
      --row: #2e2e33;
      --hover: #343a44;
      --text: #efeff1;
      --muted: #a8afb9;
      --border: #34343c;
      --outline: #515e6d;
      --accent: #5dade2;
      --brand: #88bdf2;
      --blue: #2669ac;
      --blue-hover: #205b96;
      --accent-soft: #213448;
      --card-marker: #d9c6fb;
      --card-marker-soft: #35294c;
      --shadow: 0 4px 20px #0002;
      background: var(--page);
      color: var(--text);
    }
    :root[data-recap-theme="light"] {
      color-scheme: light;
      --page: #f8f9fa;
      --header: #e4e7eb;
      --panel: #fff;
      --inset: #f0f2f5;
      --row: #edf1f6;
      --hover: #e0e9f3;
      --text: #1c1e21;
      --muted: #58616c;
      --border: #d5dae0;
      --outline: #95a7ba;
      --accent: #28699f;
      --brand: #2669ac;
      --accent-soft: #dcebf8;
      --card-marker: #583882;
      --card-marker-soft: #eee5fb;
      --shadow: 0 4px 20px #232b3e0b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    .shell { width: min(100% - 3rem, 68rem); margin-inline: auto; }
    .recap-header { background: var(--header); border-bottom: 1px solid var(--border); }
    .recap-header .shell {
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      color: var(--brand);
      font-size: 1.16rem;
      font-weight: 780;
      letter-spacing: -.025em;
    }
    .brand img { display: block; width: 1.68rem; height: 1.68rem; }
    main { padding-block: 1.25rem 2rem; }
    .panel {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: 0 0 .75rem;
      color: var(--accent);
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    #drop-title { font-size: 1.06rem; }
    .verification-title {
      position: relative;
      display: flex;
      align-items: center;
      gap: .3rem;
      margin-bottom: .75rem;
    }
    .verification-title .section-title { margin: 0; }
    #version-help { flex: 0 0 auto; }
    #version-info {
      width: 1.75rem;
      min-height: 1.75rem;
      padding: 0;
      border: 0;
      border-radius: .4rem;
      background: transparent;
      color: var(--muted);
    }
    #version-info:hover, #version-info:focus-visible {
      background: var(--hover);
      color: var(--accent);
    }
    .version-tooltip {
      position: absolute;
      z-index: 2;
      inset-block-end: 100%;
      inset-inline-start: 0;
      box-sizing: border-box;
      width: min(20rem, 100%);
      padding: .5rem .65rem;
      border: 1px solid var(--border);
      border-radius: .45rem;
      background: var(--row);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: .8rem;
      visibility: hidden;
    }
    #version-help:not([data-dismissed]):is(:hover, :focus-within) .version-tooltip { visibility: visible; }
    .icon { flex: 0 0 auto; width: 1rem; height: 1rem; }
    .upload-zone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .85rem 1rem;
      padding: .8rem .9rem;
      border: 1px dashed var(--outline);
      border-radius: .7rem;
      background: var(--inset);
    }
    #drop[data-dragging] .upload-zone { border-color: var(--accent); background: var(--accent-soft); }
    .upload-copy { display: flex; align-items: center; gap: .65rem; }
    .upload-copy > .icon { width: 1.6rem; height: 1.6rem; color: var(--accent); }
    .upload-copy p { margin: 0; }
    .upload-label { font-size: .95rem; font-weight: 720; }
    .upload-copy .upload-hint { margin-top: .16rem; color: var(--muted); font-size: .8rem; }
    kbd { font: inherit; font-weight: 680; }
    .input-actions { display: flex; flex-wrap: wrap; gap: .45rem; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      min-height: 2.45rem;
      padding: .36rem .7rem;
      border: 1px solid var(--border);
      border-radius: .4rem;
      background: var(--row);
      color: var(--text);
      font: inherit;
      font-size: .8rem;
      font-weight: 680;
      cursor: pointer;
    }
    button:hover { background: var(--hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: .6; cursor: wait; }
    #choose { border-color: transparent; background: var(--blue); color: #fff; }
    #choose:hover { background: var(--blue-hover); }
    #theme-toggle { min-height: 2.1rem; white-space: nowrap; }
    #theme-toggle[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
    #status { margin: .55rem 0 0; color: var(--muted); font-size: .83rem; overflow-wrap: anywhere; }
    #status:empty { margin: 0; }
    #status[data-state="found"] { color: var(--accent); }
    #scan-progress { margin-top: .65rem; }
    .scan-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: .15rem .6rem;
    }
    #scan-stage { margin: 0; font-size: .85rem; font-weight: 680; }
    #scan-elapsed, #scan-detail { color: var(--muted); font-size: .78rem; }
    #scan-elapsed { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .scan-track {
      overflow: hidden;
      height: .25rem;
      margin-top: .35rem;
      border-radius: 1rem;
      background: var(--row);
    }
    .scan-track span {
      display: block;
      width: 33%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: scan-sweep 1.6s ease-in-out infinite;
    }
    #scan-detail { margin-top: .3rem; }
    @keyframes scan-sweep {
      from { transform: translateX(-100%); }
      to { transform: translateX(303%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scan-track span { animation: none; }
    }
    #review {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(18.5rem, 1fr);
      align-items: start;
      gap: .8rem;
      margin-top: .8rem;
    }
    #review:has(#result[hidden]) { grid-template-columns: minmax(0, 1fr); }
    .preview-panel { margin: 0; }
    #shot { position: relative; overflow: hidden; border-radius: .65rem; background: var(--inset); }
    #preview-image { display: block; width: 100%; height: auto; }
    #review:has(#result[hidden]) #shot { max-width: 38rem; }
    .region {
      position: absolute;
      display: grid;
      place-items: start;
      border: 1px solid #88c7f1;
      border-radius: .22rem;
      box-shadow: inset 0 0 0 1px #10131a70;
      pointer-events: none;
    }
    .number {
      display: inline-grid;
      place-items: center;
      min-width: 1.65rem;
      padding-inline: .2rem;
      border-radius: .25rem;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .75rem;
      line-height: 1.35rem;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }
    .region .number { background: #2669ac; color: #fff; }
    .number[data-layout="card"] { background: var(--card-marker-soft); color: var(--card-marker); }
    .region[data-layout="card"] { border-color: #c6acf4; }
    .region .number[data-layout="card"] { background: #624291; color: #fff; }
    .metadata {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .28rem .9rem;
      margin: 0;
      font-size: .8rem;
    }
    .metadata:empty { display: none; }
    .metadata div { display: flex; flex-wrap: wrap; gap: 0 .36rem; min-width: 0; }
    .metadata dt { color: var(--muted); font-weight: 450; }
    .metadata dd { margin: 0; font-weight: 680; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    #shared {
      padding: .55rem .66rem;
      border: 1px solid var(--border);
      border-radius: .55rem;
      background: var(--inset);
    }
    #records { width: 100%; border-spacing: 0 .25rem; font-size: .87rem; text-align: left; }
    #records :is(th, td) { padding: .28rem .52rem; }
    #records thead th { color: var(--muted); font-size: .76rem; font-weight: 660; white-space: nowrap; }
    #records td { background: var(--row); }
    #records td:first-child { border-radius: .4rem 0 0 .4rem; }
    #records td:last-child { border-radius: 0 .4rem .4rem 0; }
    #records .group :is(th, td) { border: 1px solid var(--border); border-radius: .42rem; background: var(--inset); }
    #records .record-group-heading th {
      padding: .32rem .52rem .12rem;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: .83rem;
      font-weight: 760;
    }
    #records tbody + tbody .record-group-heading th { padding-top: .7rem; }
    #records tbody[data-layout="card"] .record-group-heading th { color: var(--card-marker); }
    .record-group-count { margin-inline-start: .44rem; color: var(--muted); font-size: .75rem; font-weight: 560; }
    .correction-icon { margin-inline-start: .35em; color: var(--muted); cursor: help; }
    .region-column { width: 1%; }
    .streamer { font-weight: 660; overflow-wrap: anywhere; }
    #records .duration { width: 1%; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #records td.duration { color: var(--accent); font-weight: 720; }
    @media (max-width: 46rem) {
      .shell { width: calc(100% - 1.5rem); }
      .recap-header .shell { min-height: 3.2rem; }
      main { padding-top: .75rem; }
      #review { grid-template-columns: minmax(0, 1fr); }
      #result { order: -1; }
    }
    @media (max-width: 31rem) {
      .brand { font-size: 1rem; }
      .panel { padding: .8rem; }
      .upload-zone { align-items: stretch; flex-direction: column; }
      .input-actions > button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>

    </div>
  </header>
  <main class="shell">
    <section id="drop" class="panel" aria-labelledby="drop-title">
      <div class="verification-title">
        <h1 id="drop-title" class="section-title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4m0 8v4h-4M4 16v4h4m0-8h8m-6-3h4m-4 6h4"/></svg>
          워터마크 검증
        </h1>
        <div id="version-help">
          <button id="version-info" type="button" aria-label="워터마크 적용 버전" aria-describedby="version-tooltip">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>
          </button>
          <span id="version-tooltip" class="version-tooltip" role="tooltip">확장 프로그램 1.7.4(2026.11.27) 이상에서 캡처한 리캡에만 워터마크가 들어갑니다.</span>
        </div>
      </div>
      <div class="upload-zone">
        <div class="upload-copy">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-4.5-4.5L7 21"/></svg>
          <div>
            <p class="upload-label">리캡 이미지 끌어놓기</p>
            <p class="upload-hint"><kbd>Ctrl+V</kbd>로 붙여넣을 수도 있어요.</p>
          </div>
        </div>
        <input id="file" type="file" accept="image/*" hidden>
        <div class="input-actions">
          <button id="choose" type="button">파일 선택</button>
          <button id="paste" type="button">붙여넣기</button>
        </div>
      </div>
      <div id="scan-progress" hidden>
        <div class="scan-heading">
          <p id="scan-stage" role="status"></p>
          <span id="scan-elapsed" aria-hidden="true"></span>
        </div>
        <div class="scan-track" role="progressbar" aria-label="워터마크 판독 진행 상태">
          <span aria-hidden="true"></span>
        </div>
        <div id="scan-detail" hidden></div>
      </div>
      <p id="status" role="status"></p>
    </section>
    <section id="review" hidden aria-label="워터마크 검증 결과">
      <figure class="panel preview-panel">
        <figcaption class="section-title">캡처 이미지</figcaption>
        <div id="shot"><canvas id="preview-image" aria-label="워터마크가 읽힌 영역을 표시한 캡처 이미지"></canvas></div>
      </figure>
      <section id="result" class="panel" aria-labelledby="result-title" hidden>
        <h2 id="result-title" class="section-title">읽힌 정보</h2>
        <dl id="shared" class="metadata"></dl>
        <table id="records" aria-label="영역별 워터마크 정보">
          <thead>
            <tr>
              <th class="region-column" scope="col">영역 번호</th>
              <th scope="col">스트리머</th>
              <th class="duration" scope="col">시청 시간</th>
            </tr>
          </thead>
        </table>
      </section>
    </section>
  </main>

    function regionChroma(data, imageWidth, region, reference = "red") {

        const { sx, sy, strength, coherence, phaseX, phaseY } = candidate;

        const stepX = sx / nativeTileScale;
        const stepY = sy / nativeTileScale;
        const phases = [[phaseX, phaseY]];
        if (Math.abs(phaseY) >= 0.25) phases.push([phaseX, phaseY - Math.sign(phaseY)]);
        if (Math.abs(phaseX) >= 0.25) phases.push([phaseX - Math.sign(phaseX), phaseY]);
        for (const [x, y] of phases) {
          for (const gain of [0.75, 1]) {
            const alignment = {
              x: ((1 - stepX) / 2 - x * stepX) * gain,
              y: ((1 - stepY) / 2 - y * stepY) * gain,
              stepX, stepY,
            };
            let restored;
            for (const extraLine of [-1, 0, 1, 2]) {
              const key = [sx, sy, alignment.x, alignment.y, extraLine].join(",");
              if (attempted.has(key)) continue;
              if (attempted.size >= 64) return null;
              attempted.add(key);
              // A fixed pixel step makes the shorter views prefixes of this buffer.
              restored ||= resizeForReading(imageData, 1 / stepX, 2, true, alignment);
              const box = { x: 0, y: 0, width: restored.width, height: restored.height + extraLine - 2 };
              const record = readLocalizedCardPayload(restored, box, true);
              if (record) return record;
            }
          }
        }
      }
      return null;
    }

    const rankGridAdjustments = [-0.0005, 0.0005, -0.001, 0.001, -0.0015, 0.0015];

    function* neighboringRankGrids(imageData, normalized, scale, correctAxes = false) {
      const { width, height } = imageData;
      const attempted = new Set([normalized.width + "," + normalized.height]);
      const markSize = (w, h) => {
        const key = w + "," + h;
        if (attempted.has(key)) return false;
        attempted.add(key);
        return true;
      };
      for (const delta of rankGridAdjustments) {
        const factor = nativeTileScale / (scale + delta);
        if (markSize(Math.round(width * factor), Math.round(height * factor))) {
          yield resizeForReading(imageData, factor);
        }
      }
      if (!correctAxes) return;

      // Even an isotropic resize rounds each axis independently. A shared scale
      // can skip a nearby grid that differs by one pixel in only one direction.
      for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {
        const w = normalized.width + dx;
        const h = normalized.height + dy;
        if (markSize(w, h)) {
          yield resizeForReading(imageData, 1, 0, false, { x: 0, y: 0, stepX: width / w, stepY: height / h });
        }
      }
    }

    const rankGridRows = list => list.filter(region => region.width / region.height > 4 &&
      region.width >= 360 && region.width <= 1000 && region.height >= 24 && region.height <= 70);

    function rankGridConfidence(image, rows) {
      const sample = rows.filter((_, i) => i % Math.ceil(rows.length / 8) === 0);
      if (!sample.length) return 0;
      let score = 0;
      for (const region of sample) {
        const { energy, origin } = rankRowSpectrum(image, region);
        let contrast = 0;
        for (let i = 0; i < pilot.length; i++) {
          const [left, right] = watermarkModels.row.pairs[i];
          const a = Math.hypot(...energy.complex(...left));
          const b = Math.hypot(...energy.complex(...right));
          contrast += pilot[i] * (b - a) / Math.max(1e-9, a + b);
        }
        score += (origin?.score ?? 0) / 12 + contrast / pilot.length;
      }
      return score / sample.length;
    }

    function refineSparseRankGrid(imageData, normalized, regions, scale, outlineScale, report) {
      const rows = rankGridRows(regions);
      if (rows.length < 4 || normalized.width * normalized.height > 4000000) return null;
      const heights = rows.map(row => row.height).sort((a, b) => a - b);
      const ratio = imageData.height / normalized.height;
      if (heights[Math.floor(heights.length / 2)] * ratio >= 24) return null;
      report("rankGrid");
      let best = { image: normalized, regions, score: rankGridConfidence(normalized, rows) };
      const centers = [normalized];
      const seen = new Set([normalized.width + "," + normalized.height]);
      const evaluate = image => {
        const key = image.width + "," + image.height;
        if (seen.has(key)) return;
        seen.add(key);
        const regions = coloredRegions(image);
        const candidates = rankGridRows(regions);
        if (candidates.length < Math.ceil(rows.length * 0.65)) return;
        const score = rankGridConfidence(image, candidates);
        if (score > best.score) best = { image, regions, score };
      };
      // The coarse frequency estimate is quantized. Look near it first, then
      // resolve horizontal and vertical pixel rounding around the best grid.
      for (const image of neighboringRankGrids(imageData, normalized, scale)) evaluate(image);
      if (outlineScale && outlineScale !== scale) {
        const fromOutline = resizeForReading(imageData, nativeTileScale / outlineScale);
        centers.push(fromOutline);
        evaluate(fromOutline);
        for (const image of neighboringRankGrids(imageData, fromOutline, outlineScale)) evaluate(image);
      }
      centers.push(best.image);
      for (const center of centers) {
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            const width = center.width + dx;
            const height = center.height + dy;
            if (seen.has(width + "," + height)) continue;
            const stepX = imageData.width / width;
            const stepY = imageData.height / height;
            evaluate(resizeForReading(imageData, 1, 0, false, { x: 0, y: 0, stepX, stepY }));
          }
        }
      }
      return best;
    }

    function readRankGridFirst(imageData, normalized, regions, scale, report) {
      const firstRows = rankGridRows(regions);
      if (firstRows.length < 4 || normalized.width * normalized.height > 4000000) return [];
      report("rankGrid");
      const read = (image, rows) => rows.flatMap(region => {
        const record = readSmallRankRow(image, region, true);
        return record ? [{ region, record, layout: "row" }] : [];
      });
      const early = read(normalized, firstRows.slice(0, 3));
      if (early.length) return early;

      let score = rankGridConfidence(normalized, firstRows) + 0.04;
      let best = null;
      for (const image of neighboringRankGrids(imageData, normalized, scale)) {
        const rows = rankGridRows(coloredRegions(image));
        if (rows.length < Math.ceil(firstRows.length * 0.65)) continue;
        const candidate = rankGridConfidence(image, rows);
        if (candidate <= score) continue;
        score = candidate;
        best = { image, rows };
      }
      if (!best) return [];
      const toX = normalized.width / best.image.width;
      const toY = normalized.height / best.image.height;
      const confirmed = read(best.image, best.rows);
      const cardRegions = confirmed.length >= firstRows.length ?
        coloredRegions(best.image).filter(region => region.width / region.height <= 4) : [];
      return decodeRegions(best.image, cardRegions, confirmed, true, false).map(({ region, record, layout }) => ({
        region: { x: region.x * toX, y: region.y * toY, width: region.width * toX, height: region.height * toY },
        record, layout,
      }));
    }

    const minimumCardGridScale = 0.275;

    function measureWatermarkGrids(imageData, frames, layout = "card", minimumScale = minimumCardGridScale) {
      const { width, height, data } = imageData;
      const increment = 0.0025;
      const anchors = [...frames].sort((a, b) => b.width * b.height - a.width * a.height)
        .slice(0, 4).map(region => {
          const { x, y, width: frameWidth, height: frameHeight } = region;
          const { chroma, texture } = regionChroma(data, width, region, "green");
          const weights = Float32Array.from(texture, spread => 1 / (1 + (spread / 24) ** 2));
          const energy = spectrum(chroma, frameWidth, frameHeight, 0.1, 3.5, 0.1, weights,
            layout, minimumScale, smallCardBackground);
          return { x, y, energy };
        });
      if (!anchors.length) return [];

      const { pairs } = watermarkModels[layout];
      const averageStrongest = votes => {
        const sample = votes.sort((a, b) => b - a).slice(0, Math.ceil(anchors.length * 0.75));
        return sample.reduce((sum, value) => sum + value, 0) / sample.length;
      };
      const inBand = ([fx, fy], scaleX, scaleY) =>
        Math.abs(fx / scaleX) < 0.5 && Math.abs(fy / scaleY) < 0.5;
      const contrast = (energy, scaleX, scaleY) => {
        let total = 0;
        let count = 0;
        for (const [index, sign] of pilot.entries()) {
          const [left, right] = pairs[index];
          if (!inBand(left, scaleX, scaleY) || !inBand(right, scaleX, scaleY)) continue;
          const a = energy(left[0], left[1] * scaleX / scaleY, scaleX);
          const b = energy(right[0], right[1] * scaleX / scaleY, scaleX);
          total += sign * (b - a) / Math.max(a + b, 1e-9);
          count++;
        }
        return total / Math.max(count, 1);
      };

      const bins = Array.from({ length: Math.round((0.575 - minimumScale) / increment) + 1 }, (_, index) => {
        const scale = minimumScale + increment * index;
        return { scale, score: averageStrongest(anchors.map(({ energy }) => contrast(energy, scale, scale))) };
      });
      const peaks = bins.filter((bin, index) => bin.score >= (bins[index - 1]?.score ?? -1) &&
        bin.score >= (bins[index + 1]?.score ?? -1));
      peaks.sort((a, b) => b.score - a.score);

      const grids = [];
      const checked = new Set();
      for (const { scale } of peaks.slice(0, 4)) {
        if (scale <= minimumScale) continue;
        const step = 2 * scale;
        const centerWidth = Math.round(width / step);
        const centerHeight = Math.round(height / step);
        // Convert neighboring frequency bins to pixel uncertainty on each axis.
        const columns = Math.ceil(width * (2 * increment) / step ** 2) + 1;
        const rows = Math.ceil(height * (2 * increment) / step ** 2) + 1;
        for (let dx = -columns; dx <= columns; dx++) {
          for (let dy = -rows; dy <= rows; dy++) {
            const gridWidth = centerWidth + dx;
            const gridHeight = centerHeight + dy;
            const key = gridWidth + "," + gridHeight;
            if (checked.has(key)) continue;
            checked.add(key);
            const scaleX = width / (2 * gridWidth);
            const scaleY = height / (2 * gridHeight);
            if (Math.min(scaleX, scaleY) < minimumScale || gridWidth * gridHeight > 4000000) continue;
            const pilotCount = pilot.filter((sign, index) =>
              inBand(pairs[index][Number(sign > 0)], scaleX, scaleY)).length;
            if (pilotCount < pilot.length / 2) continue;

            const votes = anchors.map(({ x, y, energy }) => {
              const anchorX = (x + 0.5) / (2 * scaleX) - 0.5;
              const anchorY = (y + 0.5) / (2 * scaleY) - 0.5;
              const fractionX = anchorX - Math.round(anchorX);
              const fractionY = anchorY - Math.round(anchorY);
              // The FFT starts at a cropped pixel. Undo the fractional offset
              // before comparing the pilot with the restored integer grid.
              const aligned = { complex(fx, fy) {
                if (!inBand([fx, fy], scaleX, scaleY)) return [0, 0];
                const [re, im] = energy.complex(fx, fy * scaleX / scaleY, scaleX);
                const angle = -4 * Math.PI * (fx * fractionX + fy * fractionY);
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                return [re * cos - im * sin, re * sin + im * cos];
              }};
              const [origin] = findTileOrigins(aligned, scaleX, layout);
              return (origin?.score ?? 0) / pilotCount - 0.5 + contrast(energy, scaleX, scaleY);
            });
            grids.push({ width: gridWidth, height: gridHeight, score: averageStrongest(votes) });
          }
        }
      }
      return grids.sort((a, b) => b.score - a.score);
    }

    function isCardFrame(region) {
      const aspect = region.width / region.height;
      return aspect >= 0.65 && aspect <= 2.4;
    }

    function recoverResizedCards(imageData, regions, found, report) {
      if (!regions.some(isCardFrame)) return found;
      const cards = found.filter(item => item.layout === "card");
      const covered = frame => cards.some(item =>
        overlapArea(frame, item.region) >= 0.7 * frame.width * frame.height);
      if (cards.length >= 4 && regions.filter(isCardFrame).every(covered)) return found;
      // Include card frames that are smaller than the normal color sampler's limits.
      const frames = coloredRegions(imageData, 2 * minimumCardGridScale).filter(isCardFrame);
      if (frames.length < 2 || frames.every(covered)) return found;
      report("retryCards");
      const grids = measureWatermarkGrids(imageData, frames);
      const distinct = [];
      for (const grid of grids) {
        // Keep distinct grid peaks ahead of near-identical rounding hypotheses.
        if (distinct.some(other =>
          Math.abs(other.width - grid.width) <= 3 && Math.abs(other.height - grid.height) <= 2)) continue;
        distinct.push(grid);
        if (distinct.length === 4) break;
      }
      const trials = [...new Set([...distinct, ...grids.slice(0, 4)])];
      for (const { width, height } of trials) {
        const stepX = imageData.width / width;
        const stepY = imageData.height / height;
        const raster = resizeForReading(imageData, 1, 0, true, { x: 0, y: 0, stepX, stepY });
        const project = region => ({
          x: region.x * stepX, y: region.y * stepY,
          width: region.width * stepX, height: region.height * stepY,
        });
        const unresolved = region => {
          const frame = project(region);
          return !covered(frame) && frames.some(other =>
            overlapArea(frame, other) >= 0.65 * other.width * other.height);
        };
        const candidates = coloredRegions(raster).filter(region => isCardFrame(region) && unresolved(region));
        if (!candidates.length) continue;
        const precise = [];
        for (const region of candidates) {
          if (!isTallCard(region.width, region.height)) continue;
          const refined = refineCardBounds(raster, region);
          const record = readLocalizedCardPayload(raster, refined, true, true) ||
            readLocalizedCardPayload(raster, region, true, true);
          if (record) precise.push({ region: refined, record, layout: "card" });
        }
        for (const item of decodeRegions(raster, candidates, precise, true, false)) {
          if (!unresolved(item.region)) continue;
          const match = { ...item, region: project(item.region) };
          cards.push(match);
          found.push(match);
        }
        if (frames.every(covered)) break;
      }
      return found.sort((a, b) =>
        Math.abs(a.region.y - b.region.y) < 10 ? a.region.x - b.region.x : a.region.y - b.region.y);
    }

    function sampleResizedWatermark(image, grid, region, layout) {
      const { data, width: imageWidth, height: imageHeight } = image;
      const scaleX = imageWidth / grid.width;
      const scaleY = imageHeight / grid.height;
      const left = Math.max(0, Math.floor(region.x * scaleX));
      const top = Math.max(0, Math.floor(region.y * scaleY));
      const right = Math.min(imageWidth, Math.ceil((region.x + region.width) * scaleX));
      const bottom = Math.min(imageHeight, Math.ceil((region.y + region.height) * scaleY));
      const width = right - left;
      const height = bottom - top;
      // Resize maps pixel centers, including when output dimensions have
      // independently rounded on the two axes.
      const xCoordinates = Array.from({ length: width }, (_, x) => (left + x + 0.5) / scaleX - 0.5 - region.x);
      const yCoordinates = Array.from({ length: height }, (_, y) => (top + y + 0.5) / scaleY - 0.5 - region.y);
      const { chroma, texture } = regionChroma(data, imageWidth, { x: left, y: top, width, height }, "green");
      const background = blur(chroma, width, height, smallCardBackground);
      const strips = rankStripBounds(region);
      const tall = isTallCard(region.width, region.height);
      const inside = (x, y) => {
        if (x < 0 || x >= region.width || y < 0 || y >= region.height) return false;
        if (layout === "card") {
          const fx = x / region.width;
          const fy = y / region.height;
          const portrait = ((fx - 0.5) / 0.23) ** 2 + ((fy - (tall ? 0.37 : 0.32)) / (tall ? 0.19 : 0.31)) ** 2 <= 1;
          const text = Math.abs(fx - 0.5) < (tall ? 0.32 : 0.33) &&
            fy > (tall ? 0.55 : 0.595) && fy < (tall ? 0.82 : 0.98);
          return portrait || text;
        }
        const near = x >= strips.left - 1 && x < strips.left + strips.stripWidth + 1;
        if (!near && (x < strips.right - 1 || x >= region.width - strips.inset + 1)) return false;
        const start = near ? strips.leftTop : strips.rightTop;
        return y >= start - 2 && y < start + strips.stripHeight + 1;
      };
      const samples = [];
      const edgeWeight = layout === "row" ? 22 : 15;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = y * width + x;
          if (texture[i] >= 60 || !inside(xCoordinates[x], yCoordinates[y])) continue;
          const weight = 1 / (1 + (texture[i] / edgeWeight) ** 2);
          samples.push({ x, y, value: Math.max(-3.5, Math.min(3.5, chroma[i] - background[i])), weight });
        }
      }
      return { samples, width, height, xCoordinates, yCoordinates, scaleX, scaleY };
    }

    function prepareResizedBasis(observation, origin, layout, size) {
      const { width, height, xCoordinates, yCoordinates, scaleX, scaleY } = observation;
      const { pairs, phaseTurns } = watermarkModels[layout];
      const pairCount = pilot.length + size;
      const stride = pairCount * 2;
      const cosX = new Float64Array(width * stride);
      const sinX = new Float64Array(cosX.length);
      const cosY = new Float64Array(height * stride);
      const sinY = new Float64Array(cosY.length);
      // Fit the carrier after a separable cubic downsample and the same
      // high-pass filter applied to the observed chroma.
      const axisGain = scale => {
        const cache = new Map();
        return frequency => {
          const q = Math.abs(2 * frequency / scale);
          if (!cache.has(q)) {
            let cubic = 1;
            for (let i = 1; i < 48; i++) {
              const t = i / 24;
              const kernel = t < 1 ? 1.5 * t ** 3 - 2.5 * t ** 2 + 1 : -0.5 * t ** 3 + 2.5 * t ** 2 - 4 * t + 2;
              cubic += 2 * kernel * Math.cos(2 * Math.PI * q * t);

            const background = smallCardBackground.reduce((sum, tap, i) =>
              sum + tap * Math.cos(2 * Math.PI * q * (i - (smallCardBackground.length - 1) / 2)), 0);
            cache.set(q, [Math.max(0, cubic / 24), background]);

          return cache.get(q);
        };
      };
      const gainX = axisGain(scaleX);
      const gainY = axisGain(scaleY);
      const response = pairs.slice(0, pairCount).map((pair, i) => pair.map(([fx, fy], symbol) => {
        const offset = 2 * i + symbol;
        for (let x = 0; x < width; x++) {
          const angle = 2 * Math.PI * (phaseTurns[i] + 2 * fx * (xCoordinates[x] + origin.x));
          cosX[x * stride + offset] = Math.cos(angle);
          sinX[x * stride + offset] = Math.sin(angle);
        }
        for (let y = 0; y < height; y++) {
          const angle = 4 * Math.PI * fy * (yCoordinates[y] + origin.y);
          cosY[y * stride + offset] = Math.cos(angle);
          sinY[y * stride + offset] = Math.sin(angle);
        }
        const [sampleX, backgroundX] = gainX(fx);
        const [sampleY, backgroundY] = gainY(fy);
        return sampleX * sampleY * (1 - backgroundX * backgroundY);
      }));
      return { basis: { width, height, stride, cosX, sinX, cosY, sinY }, response };
    }

    function resizedFrequencyEvidence({ samples, xCoordinates, yCoordinates }) {
      const weightSum = samples.reduce((sum, sample) => sum + sample.weight, 0);
      const mean = samples.reduce((sum, sample) => sum + sample.weight * sample.value, 0) / weightSum;
      const cache = new Map();
      const project = (coordinates, frequency) => {
        const angles = coordinates.map(pixel => 4 * Math.PI * frequency * pixel);
        return [angles.map(angle => Math.cos(angle)), angles.map(angle => Math.sin(angle))];
      };
      return { weightSum, complex(fx, fy) {
        const key = fx + "," + fy;
        if (!cache.has(key)) {
          const [cosX, sinX] = project(xCoordinates, fx);
          const [cosY, sinY] = project(yCoordinates, fy);
          let real = 0;
          let imaginary = 0;
          for (const { x, y, value, weight } of samples) {
            const v = (value - mean) * weight;
            real += v * (cosX[x] * cosY[y] - sinX[x] * sinY[y]);
            imaginary -= v * (cosX[x] * sinY[y] + sinX[x] * cosY[y]);

          cache.set(key, [real, imaginary]);
        }
        return cache.get(key);

    }

    function readResizedWatermark(image, grid, region, layout, failed) {
      const observation = sampleResizedWatermark(image, grid, region, layout);
      const { samples, scaleX, scaleY } = observation;
      const { pairs, phaseTurns } = watermarkModels[layout];
      const inBand = (fx, fy) => Math.abs(2 * fx / scaleX) < 0.5 && Math.abs(2 * fy / scaleY) < 0.5;
      const pilotCount = pilot.filter((sign, i) => inBand(...pairs[i][Number(sign > 0)])).length;
      if (!samples.length || pilotCount < pilot.length / 2) return null;
      const energy = resizedFrequencyEvidence(observation);
      const pilotEnergy = { complex: (fx, fy) => inBand(fx, fy) ? energy.complex(fx, fy) : [0, 0] };
      for (const phase of findTileOrigins(pilotEnergy, nativeTileScale, layout).slice(0, 2)) {
        if (phase.score < 0.72 * pilotCount) break;
        const lengths = likelyPayloadLengths(energy, phase, layout).slice(0, 3);
        for (const [size] of lengths) {
          if (samples.length < size * 2) continue;
          const { basis, response } = prepareResizedBasis(observation, phase, layout, size);
          const gains = [];
          for (const [i, sign] of pilot.entries()) {

              const [real, imaginary] = energy.complex(fx, fy);

          const amplitude = gains[Math.floor(gains.length / 2)];
          if (!(amplitude > 0)) continue;
          const fit = preparePayloadFit(samples, { x: 0, y: 0 }, size, layout, response, basis);
          // The masks and local texture attenuate the measured pilots unevenly.
          // Retry within their measured range using the same fitted model.
          const gainsToTry = new Set([amplitude, gains[Math.floor(gains.length * 0.75)]]);
          for (const gain of gainsToTry) {
            const bits = fit(gain);
            const record = recoverRecord(bits, 0) || recoverSoftRecord(bits);
            if (record) return record;
            if (failed && failed.length < 12) failed.push(bits);
          }

      }
      return null;
    }


    function recoverCompressedWatermarks(imageData, found, report) {
      const pending = new Map();
      const minimumScale = 0.22;
      const minimumHeight = Math.ceil(24 * 2 * minimumScale);

      const rowFrames = regions.filter(region => region.width >= imageData.width * 0.55 &&

        region.y + region.height < imageData.height);

      const occupied = (frame, layout) => found.some(item => {
        if (item.layout !== layout) return false;

        const minimumGap = Math.min(row.height, next.height) / 2;
        const gap = next.y - bottom;
        if (gap <= minimumGap) return false;
        const claimed = found.reduce((sum, item) => {
          if (item.layout !== "row") return sum;
          const inside = Math.max(0, Math.min(next.y, item.region.y + item.region.height) - Math.max(bottom, item.region.y));
          return sum + inside;

      regions.append(frame);
    }

    function renderMetadata(list, fields, record) {
      for (const [key, label] of fields) {
        const term = document.createElement("dt");
        term.textContent = label;
        const value = document.createElement("dd");
        value.textContent = record[key];
        const pair = document.createElement("div");
        pair.append(term, value);
        list.append(pair);
      }
    }

    function showResults(found) {
      result.hidden = !found.length;
      if (!found.length) return;

      const first = found[0].record;
      const common = metadataFields.filter(([key]) => found.every(({ record }) => record[key] === first[key]));
      const varying = metadataFields.filter(field => !common.includes(field));
      renderMetadata(shared, common, first);

      for (const { layout, title, prefix } of recordGroups) {
        const entries = found.filter(item => item.layout === layout);
        if (!entries.length) continue;
        const body = records.createTBody();
        body.dataset.layout = layout;
        const heading = body.insertRow();
        heading.className = "group record-group-heading";
        const label = document.createElement("th");
        label.scope = "rowgroup";
        label.colSpan = 3;
        const count = document.createElement("span");
        count.className = "record-group-count";
        count.textContent = entries.length + "개";
        label.append(title, " ", count);
        heading.append(label);

        const byMetadata = new Map();
        entries.forEach(({ region, record }, index) => {
          const marker = prefix + (index + 1);
          showRegion(region, marker, layout);
          const key = JSON.stringify(varying.map(([field]) => record[field]));
          if (!byMetadata.has(key)) byMetadata.set(key, []);
          byMetadata.get(key).push({ marker, record });
        });
        for (const group of byMetadata.values()) {
          if (varying.length) {
            const metadataRow = body.insertRow();
            metadataRow.className = "group";
            const cell = metadataRow.insertCell();
            cell.colSpan = 3;
            const metadata = document.createElement("dl");
            metadata.className = "metadata";
            renderMetadata(metadata, varying, group[0].record);
            cell.append(metadata);
          }
          for (const { marker, record } of group) {
            const row = body.insertRow();
            row.insertCell().append(regionBadge(marker, layout));
            const streamer = row.insertCell();
            streamer.className = "streamer";
            streamer.textContent = record.streamer;
            if (record.corrected) {
              const icon = document.createElement("span");
              icon.className = "correction-icon";
              icon.setAttribute("role", "img");
              icon.title = "보정된 데이터 · 워터마크를 읽는 과정에서 오류를 정정하고 체크섬을 확인했습니다.";
              icon.setAttribute("aria-label", icon.title);
              icon.textContent = "⟳";
              streamer.append(icon);
            }
            const duration = row.insertCell();
            duration.className = "duration";
            duration.textContent = formatTime(record.watchSeconds);
          }
        }
      }
    }

    async function inspect(file) {
      if (!file) return;
      latestRequest++;
      activeRead?.abort();
      const read = new AbortController();
      activeRead = read;
      const startedAt = performance.now();
      const showStage = (stage, current, total) => {
        if (read.signal.aborted) return;
        const message = scanStages[stage];
        if (scanStage.textContent !== message) scanStage.textContent = message;
        const detail = total ? (stage === "outline" ? "추가 후보 " : "후보 영역 ") + current + "/" + total : "";
        if (scanDetail.textContent !== detail) scanDetail.textContent = detail;
        scanDetail.hidden = !detail;
      };
      const updateElapsed = () => {
        const seconds = Math.floor((performance.now() - startedAt) / 1000);
        const minutes = Math.floor(seconds / 60);
        scanElapsed.textContent = "경과 " + (minutes ? minutes + "분 " : "") + seconds % 60 + "초";
      };
      setStatus("");
      showStage("open");
      updateElapsed();
      scanProgress.hidden = false;
      const timer = setInterval(updateElapsed, 1000);
      read.signal.addEventListener("abort", () => clearInterval(timer), { once: true });

      review.hidden = true;
      shared.replaceChildren();
      Array.from(records.tBodies).forEach(body => body.remove());
      regions.querySelectorAll(".region").forEach(region => region.remove());
      const analysisFailure = "이미지를 분석하지 못했어요. 이미지 해상도가 낮거나 분석에 필요한 정보를 읽을 수 없을 때 이런 문제가 발생할 수 있어요.";
      let bitmap;
      try {
        bitmap = await createImageBitmap(file);
        if (read.signal.aborted) return;
        showStage("prepare");
        await new Promise(resolve => setTimeout(resolve, 0));
        if (read.signal.aborted) return;
        const scale = Math.min(1, Math.sqrt(20000000 / (bitmap.width * bitmap.height)));
        preview.width = Math.max(1, Math.round(bitmap.width * scale));
        preview.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = preview.getContext("2d", { willReadFrequently: true });
        context.drawImage(bitmap, 0, 0, preview.width, preview.height);
        const pixels = context.getImageData(0, 0, preview.width, preview.height);
        const found = await readPixels(pixels, read.signal, showStage);
        if (read.signal.aborted) return;
        showResults(found);
        review.hidden = false;
        setStatus(found.length ?
          found.length + "개 영역의 워터마크를 읽었습니다." : analysisFailure,
          Boolean(found.length));
      } catch {
        if (!read.signal.aborted) {
          setStatus(bitmap ? analysisFailure : "이 이미지 파일을 열 수 없습니다.");
        }
      } finally {
        bitmap?.close();
        clearInterval(timer);
        if (activeRead === read) {
          activeRead = undefined;
          scanProgress.hidden = true;
        }
      }
    }

    const pasteButton = document.getElementById("paste");
    const isImage = type => type.startsWith("image/");

    document.addEventListener("paste", event => {
      const clipboard = event.clipboardData;
      if (!clipboard) return;
      const image = Array.from(clipboard.files).find(file => isImage(file.type)) ||
        Array.from(clipboard.items).find(item => item.kind === "file" && isImage(item.type))?.getAsFile();
      if (!image) {
        setStatus("클립보드에 이미지가 없습니다.");
        return;
      }
      event.preventDefault();
      inspect(image);
    });

    pasteButton.addEventListener("click", async () => {
      const shortcut = "이미지를 복사한 뒤 이 화면에서 Ctrl+V를 눌러 주세요.";
      if (typeof navigator.clipboard?.read !== "function") {
        setStatus(shortcut);
        return;
      }
      const request = latestRequest;
      pasteButton.disabled = true;
      try {
        const items = await navigator.clipboard.read();
        if (request !== latestRequest) return;
        for (const item of items) {
          const type = item.types.find(isImage);
          if (type) {
            const image = await item.getType(type);
            if (request === latestRequest) await inspect(image);
            return;
          }
        }
        setStatus("클립보드에 이미지가 없습니다.");
      } catch {
        if (request === latestRequest) {
          setStatus("클립보드에 직접 접근할 수 없습니다. " + shortcut);
        }
      } finally {
        pasteButton.disabled = false;
      }
    });

    document.getElementById("choose").addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      inspect(input.files[0]);
      input.value = "";
    });
    drop.addEventListener("dragover", event => {
      event.preventDefault();
      drop.setAttribute("data-dragging", "");
    });
    drop.addEventListener("dragleave", () => drop.removeAttribute("data-dragging"));
    drop.addEventListener("drop", event => {
      event.preventDefault();
      drop.removeAttribute("data-dragging");
      inspect(event.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
